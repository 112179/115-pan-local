name: Pan115Local

options:
  bundleIdPrefix: com.minis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    MARKETING_VERSION: "1.6"
    CURRENT_PROJECT_VERSION: "16"
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  BigInt:
    url: https://github.com/attaswift/BigInt.git
    from: "5.3.0"

targets:
  Pan115Local:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: Sources
      - path: Support/Assets.xcassets

    dependencies:
      - package: BigInt
        product: BigInt
      - framework: Vendor/MobileVLCKit-binary/MobileVLCKit.xcframework
        embed: true

    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 115 云下载 Local
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minis.pan115local
        PRODUCT_NAME: Pan115Local
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

    scheme:
      testTargets: []
