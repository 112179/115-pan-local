name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Fetch MobileVLCKit
        run: |
          mkdir -p Vendor
          curl -sL --retry 3 -o /tmp/vlc.tar.xz "https://download.videolan.org/pub/cocoapods/prod/MobileVLCKit-3.7.5-a213fd11-6de05adc.tar.xz"
          tar -xJf /tmp/vlc.tar.xz -C Vendor
          rm -rf "Vendor/MobileVLCKit-binary/doc" "Vendor/MobileVLCKit-binary/Sample Code"
          find Vendor/MobileVLCKit-binary -name "*.dSYM" -type d -prune -exec rm -rf {} +
          du -sh Vendor/MobileVLCKit-binary/MobileVLCKit.xcframework
          ls Vendor/MobileVLCKit-binary/MobileVLCKit.xcframework

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          xcodebuild -list -project Pan115Local.xcodeproj
          grep -c "MPVKit" Pan115Local.xcodeproj/project.pbxproj || true

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies -project Pan115Local.xcodeproj -scheme Pan115Local

      - name: Build (code signing disabled)
        run: |
          set -o pipefail
          xcodebuild \
            -project Pan115Local.xcodeproj \
            -scheme Pan115Local \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee build.log | tail -n 60

      - name: Report errors
        if: failure()
        run: |
          echo "===== compile errors ====="
          grep -nE "error:|warning: .*deprecated" build.log | head -n 60 || true
          echo "===== tail ====="
          tail -n 120 build.log || true

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then echo "::error::找不到 .app，构建失败"; exit 1; fi
          echo "app = $APP_PATH"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP_PATH" out/Payload/
          cd out
          zip -qry Pan115Local-unsigned.ipa Payload
          ls -lh Pan115Local-unsigned.ipa
          unzip -l Pan115Local-unsigned.ipa | head -n 20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pan115LocalLocal-unsigned-ipa
          path: out/Pan115Local-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
