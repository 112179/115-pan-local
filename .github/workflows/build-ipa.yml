name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          xcodebuild -list -project Pan115Local.xcodeproj

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies -project Pan115Local.xcodeproj -scheme Pan115Local

      - name: Build (code signing disabled)
        run: |
          set -o pipefail
          xcodebuild \
            -project Pan115Local.xcodeproj \
            -scheme Pan115Local \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee build.log | tail -n 60

      - name: Report errors
        if: failure()
        run: |
          echo "===== compile errors ====="
          grep -nE "error:" build.log | head -n 80 || true
          echo "===== tail ====="
          tail -n 150 build.log || true

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then echo "::error::找不到 .app，构建失败"; exit 1; fi
          echo "app = $APP_PATH"
          du -sh "$APP_PATH"
          ls "$APP_PATH/Frameworks" 2>/dev/null | head -30 || true
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP_PATH" out/Payload/
          cd out
          zip -qry Pan115Local-unsigned.ipa Payload
          ls -lh Pan115Local-unsigned.ipa
          unzip -l Pan115Local-unsigned.ipa | head -n 20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pan115LocalLocal-unsigned-ipa
          path: out/Pan115Local-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
